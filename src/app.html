<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function() {
				function updateZoom() {
					var w = document.documentElement.clientWidth || window.innerWidth;
					if (w >= 1920) {
						document.documentElement.style.setProperty('--doc-zoom', '1');
					} else if (w >= 1280) {
						// 1280px ~ 1920px: 서브픽셀 반올림 넘침 방지(-1px)로 가로스크롤 방지 (overflow-x 사용 안 함)
						document.documentElement.style.setProperty('--doc-zoom', String((w - 1) / 1920));
					} else {
						// 1280px 미만: 최소 1280px 고정 스케일 (가로 스크롤 허용)
						document.documentElement.style.setProperty('--doc-zoom', String(1280 / 1920));
					}
				}
				updateZoom();
				window.addEventListener('resize', updateZoom, { passive: true });
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
